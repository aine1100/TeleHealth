services:
  # Single app (API + React) — matches Render one-service deploy
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alive-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/alive_health
      PLATFORM_URL: ${PLATFORM_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${APP_HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: alive-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: alive_health
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional split stack (nginx frontend + API). Use: docker compose --profile split up -d
  backend:
    profiles: ["split"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alive-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/alive_health
      PLATFORM_URL: ${PLATFORM_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"

  frontend:
    profiles: ["split"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""
    container_name: alive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  mongo_data:
  backend_uploads:
